[package]
name = "diesel-jsonb-custom-type-example"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1"
serde = "1"
serde_json = "1"
diesel = { git = "https://github.com/diesel-rs/diesel", branch = "master", features = ["sqlite", "chrono", "uuid", "serde_json"] }
diesel_migrations = { git = "https://github.com/diesel-rs/diesel", branch = "master", features = ["sqlite"] }

[dev-dependencies]
tokio = { version = "1.44.0", features = ["rt", "macros"] }
tokio-test = "0.4.4"
rstest = "0.25.0"
